[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-trace-signals"
version = "0.1.0"
description = "Local memory and analytics layer for coding-agent session traces (Claude Code, Gemini CLI, OpenCode), served back to agents via MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lan Guo" }]
keywords = ["coding-agents", "memory", "mcp", "claude-code", "llm", "observability"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "anthropic>=0.30",
    "sqlite-vec>=0.1.1",
    "tiktoken>=0.7",
    "click>=8.1",
    "rich>=13.0",
    "mcp>=1.0",
    "scikit-learn>=1.9.0",
    "umap-learn>=0.5.12",
    "hdbscan>=0.8.44",
]

[project.optional-dependencies]
ner = ["gliner>=0.2"]
ui = ["streamlit>=1.35", "plotly>=5.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
ats = "agent_trace_signals.cli:cli"

[project.urls]
Repository = "https://github.com/LanGuo/agent-trace-signals"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_trace_signals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Experiment scripts set up sys.path before importing the package
"experiments/**" = ["E402", "E702"]
"scripts/**" = ["E402", "E702"]
# Compact one-line lookup rules
"src/agent_trace_signals/pipeline/step_scoring.py" = ["E701"]
